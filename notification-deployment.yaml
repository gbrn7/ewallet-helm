apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: notification
    template: 
      metadata:
        labels:
          app: notification
      spec:
        containers:
         - name: notification
           image: gbrn7/ewallet-notification:latest
           ports:
            - containerPort: 7003 #gRPC